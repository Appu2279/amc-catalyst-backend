# Production on a single EC2 instance: Postgres, the API and Caddy.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Reads its values from a .env file sitting next to it on the server. That file
# is never committed and never baked into the image.
#
# Since the database lives here rather than on a managed service, nothing backs
# it up for you. scripts/backup-db.sh + the cron entry in DEPLOY.md are not
# optional extras — they are the only copy of your question bank.

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-amc_catalyst}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      # Named volume: the data outlives the container, so rebuilds and reboots
      # are safe. `docker compose down` leaves it alone — `down -v` destroys it,
      # which is the one command to never run on this box.
      #
      # Mounted at /var/lib/postgresql, NOT .../data. From Postgres 18 the image
      # keeps data in a major-version subdirectory (18/docker) so that pg_upgrade
      # can work across versions; mounting the old path makes it refuse to start.
      - pgdata:/var/lib/postgresql
    ports:
      # Bound to the host's loopback interface, NOT to 0.0.0.0. The difference
      # matters: "5432:5432" would listen on every interface and expose the
      # database to the internet (Docker writes its own iptables rules and can
      # punch straight through a host firewall). With the 127.0.0.1 prefix the
      # only way in is from the instance itself — which means an SSH tunnel,
      # so DBeaver works without opening 5432 in the security group.
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME:-amc_catalyst}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # "db" is the service name above, resolved on the compose network.
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME:-amc_catalyst}
      # A container Postgres has no certificate; the connection never leaves
      # the host's private network.
      DB_SSL: 'false'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      # Study notes and payment screenshots are stored as private S3 objects.
      # No access key/secret here on purpose: credentials come from the EC2
      # instance's IAM role via instance metadata, not the environment. That
      # requires the instance's metadata hop limit to be 2 (not the default 1)
      # so a request from inside this container can reach it — see DEPLOY.md.
      # Not marked required: without S3_BUCKET the API still runs and
      # everything except notes works, and the server logs a warning at boot
      # rather than refusing to start. Opening a note returns a clear 503
      # instead of a broken page.
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET}
    expose:
      - '3000'
    depends_on:
      db:
        # Waits until Postgres accepts connections, not merely until the
        # container exists, so the API does not crash-loop on boot.
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Without a volume, every redeploy requests new
      # ones and you hit Let's Encrypt's rate limit (5 per domain per week),
      # losing HTTPS for days.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
